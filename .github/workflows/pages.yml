# Builds the site with Zola and the manual with mdBook, then publishes both on GitHub Pages.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6,mdbook@0.5.4
      - run: zola build
      - name: Build the manual (German at /handbuch/, English at /en/manual/)
        run: |
          mdbook build handbuch/de -d "$PWD/public/handbuch"
          mdbook build handbuch/en -d "$PWD/public/en/manual"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
